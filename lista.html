<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administración - Búsqueda y Exportación</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --guindo: #800020; --verde-excel: #1D6F42; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .panel { background: white; max-width: 900px; margin: auto; padding: 25px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--guindo); padding-bottom: 15px; margin-bottom: 20px; }
        
        /* Buscador */
        .search-container { margin-bottom: 20px; display: flex; gap: 10px; }
        .search-input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .search-input:focus { border-color: var(--guindo); outline: none; }

        .btn-excel { background: var(--verde-excel); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: var(--guindo); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; color: #333; }
        tr:hover { background: #fff5f6; }
        .no-results { text-align: center; padding: 20px; color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="panel">
    <div class="header">
        <h2 style="color: var(--guindo); margin: 0;">Gestión de Participantes</h2>
        <button class="btn-excel" onclick="descargarExcel()">📊 Exportar Excel</button>
    </div>

    <div class="search-container">
        <input type="text" id="ci-search" class="search-input" placeholder="🔍 Buscar por Cédula de Identidad (CI)..." onkeyup="filtrarPorCI()">
    </div>

    <table id="tabla-rifa">
        <thead>
            <tr>
                <th>Ticket</th>
                <th>Nombre</th>
                <th>CI</th>
                <th>Fecha</th>
            </tr>
        </thead>
        <tbody id="lista-body">
            </tbody>
    </table>
    <div id="msg-vacio" class="no-results" style="display: none;">No se encontraron registros con esa CI.</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Configuración de Firebase
    const firebaseConfig = { 
        apiKey: "TU_API_KEY", 
        authDomain: "rifaapp-3367c.firebaseapp.com", 
        projectId: "rifaapp-3367c", 
        storageBucket: "rifaapp-3367c.appspot.com", 
        messagingSenderId: "384100599977", 
        appId: "TU_APP_ID" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function cargarParticipantes() {
        const body = document.getElementById('lista-body');
        try {
            const q = query(collection(db, "tickets"), orderBy("numero", "asc"));
            const snap = await getDocs(q);
            
            body.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                body.innerHTML += `
                    <tr class="ticket-row">
                        <td><strong>${d.numero}</strong></td>
                        <td>${d.nombre}</td>
                        <td class="ci-cell">${d.ci}</td>
                        <td>${d.fecha.toDate().toLocaleDateString()}</td>
                    </tr>`;
            });
        } catch (e) {
            body.innerHTML = "<tr><td colspan='4'>Error al cargar datos de Firebase.</td></tr>";
        }
    }

    // Filtrado en tiempo real por CI
    window.filtrarPorCI = function() {
        const input = document.getElementById('ci-search').value.toLowerCase();
        const rows = document.getElementsByClassName('ticket-row');
        let encontrados = 0;

        for (let row of rows) {
            const ci = row.querySelector('.ci-cell').innerText.toLowerCase();
            if (ci.includes(input)) {
                row.style.display = "";
                encontrados++;
            } else {
                row.style.display = "none";
            }
        }
        
        document.getElementById('msg-vacio').style.display = (encontrados === 0) ? "block" : "none";
    }

    window.descargarExcel = function() {
        const table = document.getElementById("tabla-rifa");
        const wb = XLSX.utils.table_to_book(table);
        XLSX.writeFile(wb, "Reporte_Rifa_Final.xlsx");
    }

    cargarParticipantes();
</script>
</body>
</html>
